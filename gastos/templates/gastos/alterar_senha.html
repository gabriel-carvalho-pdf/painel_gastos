<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #050810; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .futuristic-card { background-color: #0b0f19; border: 1px solid #ff00ff; box-shadow: 0 0 15px rgba(255, 0, 255, 0.2); border-radius: 8px; }
        .text-neon-magenta { color: #ff00ff; text-shadow: 0 0 5px rgba(255, 0, 255, 0.5); }
        
        /* O Django vai gerar os campos automaticamente. Esta regra pinta todos eles de escuro com borda magenta */
        input[type="password"] { 
            background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555; width: 100%; padding: 10px; border-radius: 4px; margin-bottom: 5px; transition: 0.3s;
        }
        input[type="password"]:focus { 
            background: rgba(0,0,0,0.8); color: #ff00ff; border-color: #ff00ff; box-shadow: 0 0 10px rgba(255, 0, 255, 0.3); outline: none; 
        }
        
        .btn-neon-magenta { background: transparent; border: 1px solid #ff00ff; color: #ff00ff; transition: 0.3s; }
        .btn-neon-magenta:hover { background: rgba(255, 0, 255, 0.2); color: #fff; box-shadow: 0 0 15px rgba(255, 0, 255, 0.5); }
        
        /* Ajuste do texto de ajuda e erros do Django */
        .helptext { font-size: 0.75rem; color: #6c757d; display: block; margin-bottom: 15px; }
        ul.errorlist { color: #ff3333; list-style-type: none; padding: 0; font-size: 0.85rem; margin-bottom: 10px; }
        label { font-weight: bold; margin-bottom: 5px; color: #ccc; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card futuristic-card p-4 mt-4">
                    <h3 class="text-neon-magenta fw-bold text-center mb-4">ALTERAR SENHA</h3>
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <!-- O Django injeta os 3 campos obrigatórios aqui -->
                        {{ form.as_p }}
                        
                        <div class="d-grid gap-3 mt-4">
                            <button type="submit" class="btn btn-neon-magenta py-2 fw-bold text-uppercase">Confirmar Nova Senha</button>
                            <a href="{% url 'perfil' %}" class="btn btn-outline-secondary py-2 text-uppercase">Cancelar e Voltar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
