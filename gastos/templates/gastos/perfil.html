<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #050810; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .futuristic-card { background-color: #0b0f19; border: 1px solid #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); border-radius: 8px; }
        .text-neon-ciano { color: #00f0ff; text-shadow: 0 0 5px rgba(0, 240, 255, 0.5); }
        .form-control { background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555; }
        .form-control:focus { background: rgba(0,0,0,0.8); color: #00f0ff; border-color: #00f0ff; box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); outline: none; }
        .btn-neon { background: transparent; border: 1px solid #00f0ff; color: #00f0ff; transition: 0.3s; }
        .btn-neon:hover { background: rgba(0, 240, 255, 0.2); color: #fff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card futuristic-card p-4 mt-4">
                    <h3 class="text-neon-ciano fw-bold text-center mb-4">MEU PERFIL</h3>
                    
                    <form method="POST">
                        <!-- Proteção obrigatória do Django -->
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label text-muted" style="font-size: 0.85rem;">UTILIZADOR (Acesso)</label>
                            <input type="text" class="form-control" value="{{ request.user.username }}" disabled style="opacity: 0.6; cursor: not-allowed;">
                        </div>                    

                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: #ffaa00;">NOME DE EXIBIÇÃO</label>
                            <input type="text" name="nome_exibicao" class="form-control" value="{{ request.user.perfil.nome_exibicao|default_if_none:'' }}" placeholder="Como prefere ser chamado?">
                       </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">E-MAIL</label>
                            <input type="email" name="email" class="form-control" value="{{ request.user.email }}" placeholder="seu@email.com">
                        </div>

                        <div class="d-grid gap-3">
                            <button type="submit" class="btn btn-neon py-2 fw-bold text-uppercase">Salvar Alterações</button>
                            
                            <!-- Novo botão para mudar a senha -->
                            <a href="{% url 'alterar_senha' %}" class="btn btn-outline-warning py-2 text-uppercase" style="border-color: rgba(255, 193, 7, 0.5);">🔐 Alterar Senha de Acesso</a>
                            
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary py-2 text-uppercase">Voltar ao Dashboard</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
