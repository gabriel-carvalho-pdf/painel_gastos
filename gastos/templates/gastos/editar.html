<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }} | Sistema Central</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at top, #131324 0%, #05050a 100%); color: #e0e0e0; font-family: 'Rajdhani', sans-serif; height: 100vh; display: flex; align-items: center; }
        .futuristic-card { background: rgba(10, 10, 20, 0.8); border: 1px solid #ffaa00; box-shadow: 0 0 20px rgba(255, 170, 0, 0.2); backdrop-filter: blur(10px); border-radius: 8px; }
        h3 { color: #ffaa00; text-transform: uppercase; text-shadow: 0 0 15px #ffaa00; letter-spacing: 2px; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; background: rgba(0, 0, 0, 0.6); border: 1px solid #555; color: #fff; border-radius: 4px; }
        input:focus { outline: none; border-color: #ffaa00; box-shadow: 0 0 10px rgba(255, 170, 0, 0.5); }
        label { color: #aaa; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 5px; }
        .btn-neon-orange { background: transparent; color: #ffaa00; border: 1px solid #ffaa00; text-transform: uppercase; font-weight: 700; transition: 0.3s; }
        .btn-neon-orange:hover { background: #ffaa00; color: #000; box-shadow: 0 0 15px #ffaa00; }
        .link-voltar { color: #aaa; text-decoration: none; text-transform: uppercase; font-size: 0.9rem; transition: 0.3s;}
        .link-voltar:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card futuristic-card p-4">
                    <h3 class="text-center mb-4">{{ titulo }}</h3>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-neon-orange w-100 py-2 mt-3">ATUALIZAR DADOS</button>
                    </form>
                    <div class="text-center mt-4">
                        <a href="{% url 'home' %}" class="link-voltar">< ABORTAR E VOLTAR</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
